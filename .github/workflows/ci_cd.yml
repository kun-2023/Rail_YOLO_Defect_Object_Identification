name: Rail Defect CI/CD pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  AWS_REGION: ca-central-1

  ECR_API_REPOSITORY: railway-defect-api
  ECR_STREAMLIT_REPOSITORY: railway-defect-streamlit

  ECS_CLUSTER: railway-defect-cluster
  ECS_SERVICE: railway-defect-service

jobs:

  # CI

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_api.txt
          pip install pytest
          pip install "dvc[s3]"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{secrets.AWS_ACCESS_KEY_ID}}
          aws-secret-access-key: ${{secrets.AWS_SECRET_ACCESS_KEY}}
          aws-region: ${{env.AWS_REGION}}

      - name: Pull API model with DVC
        run: |
          dvc pull outputs/yolo/Rail_Defect_Detect_7class/weights/best.pt

      - name: Run tests
        run: |
          python -m pytest -v
  # CD

  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install DVC
        run: |
          pip install "dvc[s3]"


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{secrets.AWS_ACCESS_KEY_ID}}
          aws-secret-access-key: ${{secrets.AWS_SECRET_ACCESS_KEY}}
          aws-region: ${{env.AWS_REGION}}

      - name: Pull API model with DVC
        run: |
          dvc pull outputs/yolo/Rail_Defect_Detect_7class/weights/best.pt

      - name: Pull streamlit images with DVC
        run: |
          dvc pull outputs/frontend_data/images
          dvc pull outputs/frontend_data/test_metrics.json

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # build and push API image
      - name: Build API Image
        run: |
          docker build \
            -f Dockerfile.api \
            -t ${{steps.login-ecr.outputs.registry}}/${{env.ECR_API_REPOSITORY}}:latest \
            . 
      
      - name: Push API image
        run: |
          docker push ${{steps.login-ecr.outputs.registry}}/${{env.ECR_API_REPOSITORY}}:latest

        
      # build and push streamlit image
      - name: Build Streamlit image
        run: |
          docker build \
            -f Dockerfile.streamlit \
            -t ${{steps.login-ecr.outputs.registry}}/${{env.ECR_STREAMLIT_REPOSITORY}}:latest \
            .

      - name: Push Streamlit image
        run: |
          docker push \
            ${{steps.login-ecr.outputs.registry}}/${{env.ECR_STREAMLIT_REPOSITORY}}:latest

      # ECS Deployment
      - name: Force ECS Deployment
        run: |
          aws ecs update-service \
            --cluster ${{env.ECS_CLUSTER}} \
            --service ${{env.ECS_SERVICE}} \
            --desired-count 1 \
            --force-new-deployment \
            --region ${{env.AWS_REGION}}
            

